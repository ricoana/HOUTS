<!DOCTYPE html>
<html lang="en" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google" content="notranslate">
    <title>HOUTS | AI Architecture Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    
    <style>
        .chat-main-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 940px;
            margin: 0 auto;
            min-height: calc(100vh - 80px); 
            padding: 2rem 1.5rem 10rem 1.5rem; 
            box-sizing: border-box;
            position: relative;
        }

        .chat-messages-container {
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            padding: 1rem 0;
            width: 100%;
        }

        /* --- 4-STEP INTERACTIVE QUESTIONNAIRE CONTAINER --- */
        .wizard-container {
            width: 100%;
            background: rgba(18, 18, 21, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(20px);
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255,255,255,0.1);
            animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            margin-bottom: 2rem;
        }

        .wizard-progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .wizard-progress-fill {
            height: 100%;
            width: 25%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .wizard-step-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.25rem;
        }

        .wizard-step-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #f4f4f5;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .wizard-step-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            background: rgba(99, 102, 241, 0.2);
            color: #818cf8;
            border: 1px solid rgba(99, 102, 241, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .wizard-input-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-top: 1rem;
        }

        .wizard-text-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 1rem 1.25rem;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: all 0.25s ease;
            box-sizing: border-box;
        }

        .wizard-text-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.25);
            background: rgba(0, 0, 0, 0.5);
        }

        .wizard-nav-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: 1.75rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .wizard-btn-submit {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none;
            color: #ffffff;
            padding: 0.85rem 1.85rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
            transition: all 0.25s ease;
        }

        .wizard-btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.5);
        }

        .chat-input-wrapper {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 940px;
            padding: 0 1.5rem 2.5rem 1.5rem;
            background: linear-gradient(transparent 0%, var(--bg-main) 40%);
            z-index: 10;
            box-sizing: border-box;
        }

        .chat-input-container {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            transition: var(--transition);
        }

        .chat-input-container:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow), 0 10px 40px rgba(0,0,0,0.3);
        }

        .chat-input-container textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            max-height: 160px;
            line-height: 1.5;
            padding: 0.25rem 0;
        }

        .chat-send-btn {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }

        .chat-copyright {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 0.85rem;
            opacity: 0.8;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="bg-grid-overlay"></div>
    <div class="ambient-glow"></div>

    <header class="site-header">
        <div class="header-container">
            <a href="./index.html#home" class="brand-logo">HOUTS<span>.</span></a>
            
            <button class="mobile-menu-toggle" aria-label="Toggle Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="nav-menu">
                <a href="./index.html#home" class="nav-link">Home</a>
                <a href="./index2.html" class="nav-link">Capabilities</a>
                <a href="#login" class="nav-link auth-link-login">Login</a>
                <a href="#signup" class="nav-cta-btn">Get Started</a>
            </nav>
        </div>
    </header>

    <main class="chat-main-layout">
        <div id="chat-messages" class="chat-messages-container">
            <div id="wizard-box" class="wizard-container">
                <div class="wizard-progress-bar">
                    <div id="wizard-progress-fill" class="wizard-progress-fill"></div>
                </div>

                <div class="wizard-step-header">
                    <div id="wizard-step-title" class="wizard-step-title">🌐 Website Name</div>
                    <span id="wizard-step-badge" class="wizard-step-badge">Question 1 of 4</span>
                </div>

                <div id="wizard-step-content"></div>

                <div class="wizard-nav-actions">
                    <button id="wizard-btn-submit" class="wizard-btn-submit">
                        <span>Continue</span>
                        <span>→</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div class="chat-input-wrapper">
        <div class="chat-input-container">
            <textarea id="chat-textarea" rows="1" placeholder="Type here to edit or adjust your generated website..." required></textarea>
            <button class="chat-send-btn" id="chat-send-btn" aria-label="Send Message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <div class="chat-copyright">&copy; 2026 HOUTS. Dedicated to digital craftsmanship.</div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@google/genai": "https://esm.run/@google/genai"
        }
      }
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
